repos:

- repo: https://github.com/psf/black
  rev: 24.10.0
  hooks:

  - id: black

- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.8.6
  hooks:

  - id: ruff

- repo: local
  hooks:

  - id: pytest
    name: pytest
    entry: pytest
    language: system
    pass_filenames: false
    always_run: true
