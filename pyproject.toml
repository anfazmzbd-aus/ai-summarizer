[tool.pytest.ini_options]
markers = [
    "live: tests requiring live external provider/API access",
    "integration: tests requiring provider integration behavior",
]

pythonpath = [
"."
]

testpaths = [
"app/tests"
]

[tool.black]

line-length = 88

target-version = ["py311"]

extend-exclude = '''/app/legacy/'''

[tool.isort]

profile = "black"

[tool.ruff]

line-length = 88

target-version = "py311"

exclude = ["app/legacy/*"]

